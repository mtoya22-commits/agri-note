<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>畑ノート</title>
<meta name="description" content="畝と区画の作付けから、今週やることと手順を自動で出す家庭菜園ノート">
<meta name="theme-color" content="#f1f3ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14170f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="畑ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#f1f3ed;
  --surface:#fbfcf9;
  --surface2:#e7ebe1;
  --ink:#1f251d;
  --ink2:#57604f;
  --ink3:#8a9382;
  --line:#d7ddcf;
  --line2:#c3cbb7;
  --accent:#3d6b3a;
  --accent-soft:#e1ebdb;
  --soil:#7a6249;
  --late:#a5402a;
  --late-soft:#f6e2dc;
  --soon:#8d6a14;
  --soon-soft:#f3ead0;
  --ok:#3d6b3a;
  --shadow:0 1px 2px rgba(31,37,29,.06), 0 6px 16px -10px rgba(31,37,29,.18);
  --grow:#c8dcc0;
  --frost:#2f5f8a;
  --frost-soft:#e3edf6;
  --frost-line:#c3d6e8;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  --serif:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14170f;
    --surface:#1d2118;
    --surface2:#272c21;
    --ink:#e9ede2;
    --ink2:#a8b0a0;
    --ink3:#7a8272;
    --line:#333a2c;
    --line2:#424a39;
    --accent:#93c485;
    --accent-soft:#25301e;
    --soil:#bb9d79;
    --late:#e8917a;
    --late-soft:#37201a;
    --soon:#dcb35c;
    --soon-soft:#302713;
    --ok:#93c485;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -10px rgba(0,0,0,.6);
    --grow:#42573a;
    --frost:#9cc4ea;
    --frost-soft:#182532;
    --frost-line:#2a3d50;
  }
}
:root[data-theme="dark"]{
  --bg:#14170f;
  --surface:#1d2118;
  --surface2:#272c21;
  --ink:#e9ede2;
  --ink2:#a8b0a0;
  --ink3:#7a8272;
  --line:#333a2c;
  --line2:#424a39;
  --accent:#93c485;
  --accent-soft:#25301e;
  --soil:#bb9d79;
  --late:#e8917a;
  --late-soft:#37201a;
  --soon:#dcb35c;
  --soon-soft:#302713;
  --ok:#93c485;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 16px -10px rgba(0,0,0,.6);
  --grow:#42573a;
  --frost:#9cc4ea;
  --frost-soft:#182532;
  --frost-line:#2a3d50;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-inline:16px;
  padding-block:0;
}
.wrap{max-width:680px;margin:0 auto;padding-block:0 64px}

/* ---------- header ---------- */
.top{
  position:sticky;
  top:env(safe-area-inset-top, 0px);
  z-index:20;
  background:var(--bg);
  padding-block:14px 8px;
  margin-inline:-16px;
  padding-inline:16px;
  border-bottom:1px solid var(--line);
}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:22px;
  letter-spacing:.06em;
  margin:0;
  line-height:1.2;
}
.today{
  font-size:12.5px;
  color:var(--ink2);
  font-variant-numeric:tabular-nums;
  letter-spacing:.04em;
}
.tabs{display:flex;gap:2px;margin-top:10px;background:var(--surface2);padding:3px;border-radius:9px}
.tabs button{
  flex:1;appearance:none;border:0;background:transparent;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--ink2);
  padding:7px 4px;border-radius:7px;cursor:pointer;line-height:1.4;
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- generic ---------- */
h2{
  font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:.14em;
  margin:0;color:var(--ink2);
}
.sect{margin-top:26px}
.sect-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sect-head .count{
  font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:99px;padding:0 7px;line-height:17px;
}
.muted{color:var(--ink3);font-size:13px}
.stack{display:flex;flex-direction:column;gap:8px}

/* ---------- task rows ---------- */
.task{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;
  width:100%;text-align:left;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;cursor:pointer;
}
.task:hover{border-color:var(--line2)}
.task:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.task.late{border-left:3px solid var(--late);padding-left:10px}
.task.soon{border-left:3px solid var(--soon);padding-left:10px}
.bed{
  font-family:var(--serif);font-size:13px;font-weight:700;
  width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
  background:var(--surface2);color:var(--soil);flex:none;
}
.tbody{min-width:0}
.tname{display:block;font-weight:500;line-height:1.45}
.tmeta{display:block;font-size:12px;color:var(--ink3);line-height:1.5;overflow-wrap:anywhere}
.tdue{
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2);
  text-align:right;flex:none;line-height:1.35;
}
.tdue b{display:block;font-size:11px;font-weight:700;letter-spacing:.02em}
.late .tdue b{color:var(--late)}
.soon .tdue b{color:var(--soon)}

/* ---------- 区画ストリップ ---------- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
.cell{
  border:1px solid var(--line);border-radius:7px;padding:7px 4px;min-height:58px;
  display:flex;flex-direction:column;gap:1px;justify-content:center;align-items:center;
  text-align:center;background:var(--surface2);
}
button.cell{appearance:none;font-family:inherit;color:var(--ink);cursor:pointer;width:100%}
button.cell:hover{border-color:var(--line2)}
button.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell:not(.busy){border-style:dashed;background:transparent}
.cell.busy{background:var(--accent-soft);border-color:transparent}
.cell.busy.plan{background:var(--soon-soft)}
.cell .cplus{font-size:15px;line-height:1;color:var(--ink3)}
.cell .cidx{font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.cell .cname{font-size:12px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.cell .cfam{font-size:9.5px;color:var(--ink3)}
.cell .cfree{font-size:11.5px;color:var(--ink3)}

.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
button.slot{
  appearance:none;font-family:inherit;cursor:pointer;text-align:center;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:8px 3px;min-height:54px;line-height:1.35;
  display:flex;flex-direction:column;gap:1px;justify-content:center;align-items:center;
}
button.slot:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.slot .sidx{font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums}
button.slot .sname{font-size:11px;color:var(--ink3);overflow-wrap:anywhere}
button.slot.sel{background:var(--accent);border-color:var(--accent);color:var(--bg)}
button.slot.sel .sidx,button.slot.sel .sname{color:var(--bg);opacity:.8}
button.slot.occ{border-style:dashed}
button.slot:disabled{cursor:not-allowed;opacity:.55}

/* 作付けの行（畝カード内） */
button.plantrow{
  appearance:none;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;width:100%;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:transparent;border:0;border-top:1px dashed var(--line);
  padding:9px 2px;margin:0;
}
button.plantrow:first-of-type{margin-top:10px}
button.plantrow:hover .pname{text-decoration:underline;text-underline-offset:3px}
button.plantrow:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}

/* 区画シートの作物一覧 */
.croplist{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
button.croprow{
  appearance:none;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;
  display:grid;grid-template-columns:1fr auto;grid-template-areas:"name when" "tags tags";
  gap:3px 10px;align-items:center;
  background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 4px;
}
button.croprow:hover{background:var(--surface)}
button.croprow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
button.croprow.ng .crname{color:var(--ink3)}
.crname{grid-area:name;font-weight:500;font-size:15px}
.crwhen{grid-area:when;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.crwhen b{color:var(--soon)} .crwhen b.now{color:var(--accent)}
.crtags{grid-area:tags;display:flex;gap:4px;flex-wrap:wrap}
.crtags:empty{display:none}
.tag{font-size:10.5px;border-radius:4px;padding:0 6px;line-height:18px;background:var(--surface2);color:var(--ink2);letter-spacing:.04em}
.tag.red{background:var(--late-soft);color:var(--late);font-weight:700}
.tag.amber{background:var(--soon-soft);color:var(--soon);font-weight:700}
.tag.good{background:var(--accent-soft);color:var(--accent);font-weight:700}
button.linkback{
  appearance:none;border:0;background:transparent;font-family:inherit;font-size:12.5px;
  color:var(--accent);cursor:pointer;padding:0;margin-bottom:8px;
}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn.danger{color:var(--late);border-color:var(--late)}
button.btn.danger:hover{background:var(--late-soft)}
.dangerzone{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
button.log{
  appearance:none;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;width:100%;
  background:transparent;border:0;border-bottom:1px dashed var(--line);
}
button.log:last-child{border-bottom:0}
button.log:hover{background:var(--surface2)}
button.log:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.bedcard + .bedcard{margin-top:10px}
.bedhead{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.bedhead .bed{width:30px;height:30px;font-size:15px}
.bedname{font-weight:700;font-size:15px}
.bednote{font-size:12px;color:var(--ink3);margin-left:auto;text-align:right}
.plant{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 0;border-top:1px dashed var(--line);
}
.plant:first-of-type{margin-top:8px}
.pname{font-weight:500}
.ptype{
  font-size:10.5px;letter-spacing:.08em;color:var(--ink2);
  background:var(--surface2);border-radius:4px;padding:1px 6px;
}
.pdate{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:auto}
.pacts{display:flex;gap:6px;width:100%}
.empty{padding:10px 0 2px;color:var(--ink3);font-size:13px}

/* ---------- buttons ---------- */
button.btn{
  appearance:none;font-family:inherit;font-size:13px;font-weight:500;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.5;
}
button.btn:hover{background:var(--surface2)}
button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
:root[data-theme="dark"] button.btn.primary,
:root:not([data-theme="light"]) button.btn.primary{color:#14170f}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) button.btn.primary{color:#fbfcf9}}
button.btn.primary:hover{filter:brightness(1.06)}
button.btn.wide{width:100%;padding:10px}
button.btn.ghost{border-style:dashed;color:var(--ink2)}

/* ---------- shopping ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  font-size:12.5px;border:1px solid var(--line);background:var(--surface);
  border-radius:99px;padding:3px 10px;color:var(--ink2);
}
.chip b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;font-size:11px}
button.chip{font-family:inherit;cursor:pointer}
button.chip:hover{border-color:var(--line2)}
button.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
button.chip .mark{opacity:.55;font-size:11px;margin-right:3px}

/* ---------- 適期 ---------- */
.win{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px dashed var(--line)}
.win:first-child{border-top:0;padding-top:2px}
.winname{font-weight:500}
.winwhen{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-left:auto}
.winwhen b{color:var(--soon);font-weight:700}
.winwhen b.now{color:var(--accent)}
.win .btn{margin-left:auto}

/* ---------- form ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.field label{font-size:12px;color:var(--ink2);letter-spacing:.04em}
.field select,.field input{
  font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line2);border-radius:8px;
  padding:9px 10px;width:100%;
}
.field select{padding-right:30px;text-overflow:ellipsis}
.field input{font-variant-numeric:tabular-nums}
.field select:focus,.field input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:400px){.row2{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--ink3)}

/* ---------- warnings ---------- */
.warn{
  border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:12px;
  background:var(--late-soft);color:var(--ink);border:1px solid transparent;
}
.warn.amber{background:var(--soon-soft)}
.warn.good{background:var(--accent-soft)}
.warn b{font-weight:700}
.warn .wt{display:block;font-size:11px;letter-spacing:.1em;margin-bottom:2px;color:var(--ink2)}

/* ---------- sheet ---------- */
.backdrop[hidden]{display:none!important}
.backdrop{
  position:fixed;inset:0;z-index:50;background:rgba(20,23,15,.5);
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
@media (min-width:600px){.backdrop{align-items:center;padding:24px}}
.sheet{
  background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));
  border:1px solid var(--line);
}
@media (min-width:600px){.sheet{border-radius:14px;padding-bottom:20px}}
.sheet h3{font-family:var(--serif);font-size:19px;font-weight:700;margin:0;letter-spacing:.04em}
.sheet-sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.steps{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.steps li:last-child{border-bottom:0}
.steps input[type=checkbox]{
  appearance:none;flex:none;width:19px;height:19px;margin:3px 0 0;
  border:1.5px solid var(--line2);border-radius:5px;background:var(--surface);cursor:pointer;
}
.steps input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.steps input[type=checkbox]:checked::after{
  content:"";display:block;width:5px;height:9px;margin:2px auto 0;
  border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(43deg);
}
.steps input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.steps label{font-size:14px;line-height:1.6;cursor:pointer}
.steps input:checked + label{color:var(--ink3);text-decoration:line-through}
.sheet-foot{display:flex;gap:8px;margin-top:18px}
.sheet-foot .btn{flex:1;padding:11px}
.qty{display:flex;align-items:center;gap:8px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.qty label{font-size:13px;font-weight:500;flex:none}
.qty input{flex:1;min-width:0;font-family:inherit;font-size:17px;font-variant-numeric:tabular-nums;border:0;border-bottom:1.5px solid var(--line2);background:transparent;color:var(--ink);padding:2px 4px;text-align:right}
.qty input:focus{outline:0;border-color:var(--accent)}
.qty .unit{font-size:14px;color:var(--ink2);flex:none}
.label-s{font-size:11px;letter-spacing:.12em;color:var(--ink3);margin-top:16px}

/* ---------- log ---------- */
.log{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.logdate{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;flex:none}
.logqty{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);font-size:13px}
.total{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.total .n{margin-left:auto;font-family:var(--serif);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.total .u{font-size:12px;color:var(--ink3)}

.banner{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--accent-soft);border-radius:9px;padding:9px 12px;margin-top:12px;font-size:12.5px;color:var(--ink2);
}
.banner button{margin-left:auto}
.settings{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12.5px;color:var(--ink2)}
.settings input{width:72px;font-family:inherit;font-size:14px;font-variant-numeric:tabular-nums;text-align:right;background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =========================================================
   v3 追加分
   ========================================================= */
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
.top{padding-top:calc(14px + env(safe-area-inset-top,0px));top:0}

/* 見回りカード */
.round{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
}
.round-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.round-title{font-weight:700;font-size:15px}
.round-sub{font-size:12px;color:var(--ink3)}
.round-list{display:flex;flex-direction:column;margin-top:8px}
button.round-item{
  appearance:none;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;width:100%;
  background:transparent;border:0;border-top:1px dashed var(--line);
  padding:8px 2px;display:flex;align-items:center;gap:8px;font-size:14px;
}
button.round-item:first-child{border-top:0}
button.round-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.round-item .ri-crop{color:var(--ink2);font-size:12.5px;margin-left:auto;text-align:right}
.round .btn.primary{margin-top:10px}

/* 霜カード */
.frost{
  border-radius:12px;padding:12px 14px;margin-top:14px;
  background:var(--frost-soft);border:1px solid var(--frost-line);
}
.frost-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.frost-title{font-weight:700;font-size:15px;color:var(--frost)}
.frost-temp{font-family:var(--serif);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;color:var(--frost)}
.frost-when{font-size:12px;color:var(--ink2)}
.frost ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.frost li{font-size:13.5px;line-height:1.6}
.frost li b{font-weight:700}
.frost-src{font-size:10.5px;color:var(--ink3);margin-top:8px}

/* 同期ステータス */
.syncdot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink3);cursor:pointer;
  background:transparent;border:0;font-family:inherit;padding:2px 0}
.syncdot i{width:7px;height:7px;border-radius:50%;background:var(--ink3);display:inline-block}
.syncdot.ok i{background:var(--ok)}
.syncdot.wait i{background:var(--soon)}
.syncdot.err i{background:var(--late)}
.syncdot:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* 設定 */
.setrow{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px dashed var(--line)}
.setrow:first-child{border-top:0;padding-top:2px}
.setrow .lbl{font-size:13px;font-weight:500}
.setrow .desc{font-size:12px;color:var(--ink3);line-height:1.6}
.setrow input[type=url],.setrow input[type=text]{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;
}
.setrow .btns{display:flex;gap:8px;flex-wrap:wrap}
.status-line{font-size:12.5px;color:var(--ink2)}
.status-line b.ok{color:var(--ok)} .status-line b.err{color:var(--late)} .status-line b.wait{color:var(--soon)}

/* 補正の提案 */
.sugg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-top:1px dashed var(--line)}
.sugg:first-child{border-top:0;padding-top:2px}
.sugg .sname{font-weight:500}
.sugg .sdiff{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sugg .btn{margin-left:auto}
.offchips{display:flex;flex-wrap:wrap;gap:6px}

/* メモ */
.memo{white-space:pre-wrap;font-size:13.5px;line-height:1.7;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:10px;color:var(--ink)}
textarea#pe-memo{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:9px 10px;width:100%;min-height:76px;resize:vertical;line-height:1.6;
}
textarea#pe-memo:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

/* 履歴 */
.hist{margin-top:8px;border-top:1px solid var(--line)}
button.hrow{
  appearance:none;font-family:inherit;color:var(--ink);cursor:pointer;text-align:left;width:100%;
  background:transparent;border:0;border-bottom:1px dashed var(--line);
  display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:baseline;padding:8px 2px;font-size:13.5px;
}
button.hrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.hrow .hd{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.hrow .hq{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:13px}
.hrow.harv .hn{font-weight:500}

/* 年間表（ガント） */
.yearbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.yearbar select{
  font-family:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:8px;padding:6px 28px 6px 10px;
}
.gantt-wrap{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.gantt{display:block;min-width:100%}
.gantt text{font-family:var(--sans)}
.gantt .g-month{fill:var(--ink3);font-size:10px}
.gantt .g-year{fill:var(--ink2);font-size:10px;font-weight:700}
.gantt .g-grid{stroke:var(--line);stroke-width:1}
.gantt .g-today{stroke:var(--late);stroke-width:1;stroke-dasharray:3 3}
.gantt .g-label{fill:var(--ink);font-size:12px}
.gantt .g-sub{fill:var(--ink3);font-size:10px}
.gantt .g-total{fill:var(--ink);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.gantt .g-unit{fill:var(--ink3);font-size:10px}
.gantt .g-grow{fill:var(--grow)}
.gantt .g-harv{fill:var(--accent)}
.gantt .g-plan{fill:none;stroke:var(--soon);stroke-width:1.5;stroke-dasharray:4 3}
.gantt .g-dot{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.gantt .g-row{cursor:pointer}
.gantt .g-row:hover .g-label{text-decoration:underline}
.gantt .g-hit{fill:transparent}
.gantt .g-row:focus-visible .g-hit{stroke:var(--accent);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:18px;height:8px;border-radius:4px}
.legend i.l-grow{background:var(--grow)}
.legend i.l-harv{background:var(--accent)}
.legend i.l-dot{width:8px;height:8px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent)}
.legend i.l-plan{background:transparent;border:1.5px dashed var(--soon)}
.cropfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px;-webkit-overflow-scrolling:touch}
.cropfilter .chip{flex:none}
.cmp-note{font-size:12px;color:var(--ink2);margin-top:6px}

/* 空状態 */
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:18px}
.welcome h3{font-family:var(--serif);font-size:17px;margin:0 0 6px}
.welcome ol{margin:8px 0 0;padding-left:1.3em;font-size:13.5px;line-height:1.8;color:var(--ink2)}

/* トースト */
#toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  z-index:80;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13.5px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;
}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{appearance:none;border:0;background:transparent;color:var(--bg);font-family:inherit;font-weight:700;
  font-size:13.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0;white-space:nowrap}
.brandrow .syncdot{margin-left:auto}
.brandrow .today{margin-left:auto}
.brandrow .today + .syncdot{margin-left:10px}
.card > button.plantrow:first-child{margin-top:0;border-top:0;padding-top:2px}

/* ---------- v4 ---------- */
.wsub{display:inline-block;font-size:11.5px;color:var(--ink2);margin-top:2px}
.warn .wsub{margin-top:6px}
.frost.high{background:var(--frost-soft);border-color:var(--frost)}
.frost.mid{background:var(--frost-soft)}
.frost.ask{background:var(--surface);border:1px dashed var(--frost-line)}
.frost-reason{font-size:13.5px;line-height:1.7;margin-top:6px}
.frost-cond{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-top:4px}
.frost-q{font-size:14px;font-weight:700;margin-top:10px}
.frost .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.seasongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.seasonf{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.seasonf input{width:72px;font-family:inherit;font-size:14px;text-align:right;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:380px){.seasongrid{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ftable{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ftable th{font-weight:500;color:var(--ink3);font-size:11px;text-align:left;padding:4px 8px 6px 0;border-bottom:1px solid var(--line)}
.ftable td{padding:7px 8px 7px 0;border-bottom:1px dashed var(--line)}
.ftable tr:last-child td{border-bottom:0}
.fy{color:var(--frost)}
.setrow a{color:var(--accent)}

/* ---------- v4.1：遅め・開始待ち・始める前に確認 ---------- */
.winwhen b.late, .crwhen b.late{color:var(--soon)}
.crwhen .off, .winwhen .off{color:var(--ink3);font-size:11.5px}
b.pend{color:var(--late);font-weight:700}
.warn.info{background:var(--surface2)}
.startchoice{display:flex;flex-direction:column;gap:6px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px}
.startchoice label{display:flex;align-items:center;gap:8px;cursor:pointer}
.startchoice input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.precheck{margin-top:14px;border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;background:var(--surface)}
.pc-head{font-weight:700;font-size:14px}
.pc-sub{font-size:12px;color:var(--ink2);margin-top:2px;line-height:1.6}
.pc-item{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.pc-name{font-weight:500;font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pc-when{font-size:11.5px;color:var(--soon);font-weight:400}
.pc-item ul{margin:4px 0 0;padding-left:1.2em;font-size:13px;line-height:1.7;color:var(--ink2)}
.pc-note,.pc-caution{font-size:12px;line-height:1.6;margin-top:4px}
.pc-caution{color:var(--late)}

/* ---------- v4.2：週1〜2回の運用 ---------- */
.donedate{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.donedate .dd-label{color:var(--ink2);font-size:12.5px;margin-right:2px}
.donedate input[type=date]{font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;margin-left:auto}
.round .donedate{margin-top:10px}
.stagebox{margin-top:10px;background:var(--accent-soft);border-radius:9px;padding:9px 12px;font-size:13.5px;line-height:1.7}
.freq{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ink2);background:var(--soon-soft);border-radius:8px;padding:7px 10px}
.freq b{color:var(--ink)}
.pc-now{font-size:12px;font-weight:700;color:var(--accent);margin-top:6px}
.pc-orig{margin-top:6px;font-size:12.5px;color:var(--ink2)}
.pc-orig summary{cursor:pointer;color:var(--ink3);font-size:12px}
.pc-orig summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.stagebox.past{background:var(--soon-soft)}
.tdue b.chk{color:var(--soon)}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <h1>畑ノート</h1>
      <div class="today" id="todayLabel"></div>
      <button class="syncdot" id="syncDot" data-act="go-settings" hidden><i></i><span></span></button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-week"  aria-selected="true"  aria-controls="panel-week">今週</button>
      <button role="tab" id="tab-field" aria-selected="false" aria-controls="panel-field">畑</button>
      <button role="tab" id="tab-log"   aria-selected="false" aria-controls="panel-log">記録</button>
      <button role="tab" id="tab-set"   aria-selected="false" aria-controls="panel-set">設定</button>
    </div>
  </header>
  <main>
    <section id="panel-week"  role="tabpanel" aria-labelledby="tab-week"></section>
    <section id="panel-field" role="tabpanel" aria-labelledby="tab-field" hidden></section>
    <section id="panel-log"   role="tabpanel" aria-labelledby="tab-log" hidden></section>
    <section id="panel-set"   role="tabpanel" aria-labelledby="tab-set" hidden></section>
  </main>
</div>
<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<script src="app.js"></script>
</body>
</html>
